[package]
name = "vms"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-web = "4.9.0"
actix-web-httpauth = "0.8.2"
dotenv = "0.15.0"
serde = { version = "1.0.218", features = ["derive"] }
sqlx = { version = "0.8.3", features = ["runtime-async-std-native-tls", "mysql"] }
serde_json = { version = "1.0.139", features = ["preserve_order"] }
jsonwebtokens = "1.2.0"
base64 = "0.22.1"
urlencoding = "2.1.3"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
argon2 = "0.5.3"
uuid = {version = "1.18.1", features = ["v4", "serde"]}
rand_core = "0.6"
futures = "0.3.21"
actix-cors = "0.7.1"
tokio = "1.48.0"
actix-multipart = "0.7.2"
futures-util = "0.3.31"
mime_guess = "2.0.5"
tokio-util = "0.7.17"
